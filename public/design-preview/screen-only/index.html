      <a class="hotspot nav-home" href="#top" aria-label="首页"></a>
      <a class="hotspot nav-service" href="#experience" aria-label="陪玩服务"></a>
      <a class="hotspot nav-support" href="#support" aria-label="平台优势"></a>
      <a class="hotspot nav-download" href="#download" aria-label="下载熊崽电竞 App"></a>

      <a class="hotspot scroll-hotspot" href="#experience" aria-label="向下查看产品体验"></a>

      <a class="chapter-anchor experience-anchor" id="experience" aria-label="产品体验"></a>

      <button class="hotspot phone-hotspot phone-two" type="button" data-demo-message="了解陪玩：本地展示陪玩主页" aria-label="查看陪玩主页"></button>
      <button class="hotspot phone-hotspot phone-three" type="button" data-demo-message="选择服务：本地展示服务详情" aria-label="查看服务详情"></button>

      <a class="chapter-anchor support-anchor" id="support" aria-label="支持与保障"></a>

      <a class="hotspot footer-download" href="#download" aria-label="选择苹果或安卓版本下载"></a>

    <div class="download-aura aura-left" aria-hidden="true"></div>
    <div class="download-aura aura-right" aria-hidden="true"></div>
    <div class="download-inner">
      <div class="download-brand">
        <img src="/assets/xiongzai-icon.png" alt="" />
        <span><b>熊崽电竞</b><small>XIONGZAI ESPORTS</small></span>
      </div>
      <div class="download-heading">
        <span>DOWNLOAD</span>
        <h2 id="download-title">下载熊崽电竞</h2>
        <p>选择你的设备，随时发现陪玩与服务。</p>
      </div>
      <div class="download-actions" aria-label="软件下载方式">
        <button type="button" data-demo-message="Apple 版：本地演示版本，暂未开放下载"><i></i><span><small>下载客户端</small><b>iPhone / iPad</b></span><em>›</em></button>
        <button type="button" data-demo-message="Android 版：本地演示版本，暂未开放下载"><i>◆</i><span><small>下载客户端</small><b>Android</b></span><em>›</em></button>

      <button class="download-web" type="button" data-demo-message="网页版入口：本地审核演示版本">▣&nbsp;&nbsp;访问网页版</button>

    </div>
  </section>

  <div class="demo-toast" role="status" aria-live="polite" data-toast>
    <img src="/assets/xiongzai-icon.png" alt="" /><span><b>熊崽电竞本地演示</b><small data-toast-message>暂未开放真实下载与外部服务</small></span>
    <button type="button" aria-label="关闭提示" data-toast-close>×</button>
  </div>
  <script src="/design-preview/screen-only/site.js"></script>
