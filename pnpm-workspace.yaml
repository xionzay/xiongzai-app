packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@nestjs/core": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - '@expo/metro-runtime@57.0.12'
  - '@expo/ui@57.0.12 || 57.0.23'
  - expo-constants@57.0.13
  - expo-linking@57.0.7
  - expo-router@57.0.15 || 57.0.26
  - '@expo/cli@57.0.17 || 57.0.29'
  - '@expo/fingerprint@0.20.9 || 0.20.14'
  - '@expo/local-build-cache-provider@57.0.7 || 57.0.9'
  - '@expo/metro-config@57.0.9'
  - '@expo/prebuild-config@57.0.13 || 57.0.18'
  - '@expo/router-server@57.0.7'
  - expo-asset@57.0.13
  - expo-file-system@57.0.5
  - expo-modules-core@57.0.12 || 57.0.22
  - expo-modules-jsi@57.0.5 || 57.1.2
  - expo@57.0.15 || 57.0.28
  - expo-dev-client@57.0.14 || 57.0.20
  - expo-dev-launcher@57.0.14 || 57.0.21
  - expo-dev-menu@57.0.14 || 57.0.20
  - expo-image-picker@57.0.12
  - '@expo/inline-modules@0.1.8'
  - babel-preset-expo@57.0.15
  - expo-crypto@57.0.4
  - expo-modules-autolinking@57.0.15
  - expo-splash-screen@57.0.10

patchedDependencies:
  vinext@1.0.0-beta.2: patches/vinext@1.0.0-beta.2.patch
